<link rel="stylesheet" href="assets/css/style.css">

<body>
<a class="skip" href="#view">跳到菜單內容</a>

<header class="topbar" id="topbar">
  <a class="wordmark" href="#/" aria-label="回到總覽">
    <span class="wordmark-badge" aria-hidden="true">13</span>
    <span class="wordmark-text"><b>Platform 13</b><small>全店蔬食・菜單</small></span>
  </a>
  <button class="icon-btn" id="openSearch" type="button" aria-label="搜尋餐點或飲品">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
  </button>
</header>

<nav class="stops" id="stops" aria-label="菜單分類" hidden></nav>

</footer>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section>
</div>

<div class="search-wrap" id="searchWrap" hidden>

      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>

    </div>
    <div class="search-hints" id="searchHints"></div>
    <div class="search-results" id="searchResults" aria-live="polite"></div>
  </section>
</div>

<script src="assets/js/menu-data.js"></script>
