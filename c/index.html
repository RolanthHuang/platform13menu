<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform 13｜菜單 Menu</title>
<meta name="description" content="Platform 13 全蔬食咖啡店的線上菜單（樣板 C：時鐘下）。">
<meta name="theme-color" content="#1E3A2F">
<link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/caslon-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/wenkai-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">跳到菜單內容</a>
<div class="ambient" id="ambient" aria-hidden="true"></div>

<header class="top" id="top">
  <a class="logo" href="#/" aria-label="回到首頁"><span>Platform</span><b>13</b></a>
  <button class="icon-btn" id="openSearch" type="button" aria-label="搜尋餐點或飲品">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot" id="foot">
  <p class="foot-quote" id="footQuote"></p>
  <p class="foot-note">價格以現場為準。標示「插畫示意」的是插畫，不是實拍；沒有照片的品項會陸續補上。</p>
</footer>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section>
</div>

<div class="search-wrap" id="searchWrap" hidden>
  <section class="search" role="dialog" aria-modal="true" aria-label="搜尋菜單">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="searchInput" type="search" placeholder="搜尋：拿鐵、鬆餅、無咖啡因…" autocomplete="off" enterkeyhint="search" aria-label="搜尋關鍵字">
      <button class="text-btn" id="closeSearch" type="button">關閉</button>
    </div>
    <div class="search-hints" id="searchHints"></div>
    <div class="search-results" id="searchResults" aria-live="polite"></div>
  </section>
</div>

<script src="../assets/js/menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
